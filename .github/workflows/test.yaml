# The GitHub mirror exists for these runners. The canonical repository is on
# Forgejo, and `.forgejo/workflows/test.yaml` is what gates it -- but those
# runners are Linux, and this library has a Windows path that calls Win32 and
# a macOS path that is POSIX-but-not-quite. Neither can be run on Linux, and
# until this workflow existed neither had ever been executed at all.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # Every platform reports, rather than the first failure hiding the rest:
      # the whole point here is finding out what a platform does differently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check --exclude zig-pkg .

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build

      # The tools nothing else compiles: the fuzz driver, the docs server and
      # the CLDR generator.
      - name: Compile everything else
        run: zig build check

      # What the runner itself is set to. Not an assertion -- a CI machine's
      # locale is nobody's design -- but it is the only look this project gets
      # at what these platforms actually report, and it is printed so that a
      # surprise is visible rather than silently absorbed.
      - name: What this machine says its locale is
        shell: bash
        run: |
          echo "--- environment ---"
          env | grep -E '^(LANG|LANGUAGE|LC_)' || echo "(nothing set)"
          case "${{ matrix.os }}" in
            macos-*)
              echo "--- macOS preferences ---"
              defaults read -g AppleLanguages 2>/dev/null || echo "AppleLanguages: unset"
              defaults read -g AppleLocale 2>/dev/null || echo "AppleLocale: unset"
              ;;
            windows-*)
              echo "--- Windows ---"
              powershell -Command "Get-Culture; Get-UICulture" || true
              ;;
          esac

      # And the library's own answer, which on Windows is the first time
      # `GetUserPreferredUILanguages` and `GetUserDefaultLocaleName` have ever
      # been called for real.
      - name: Run the example as this machine's user
        run: zig build example

      - name: Run the example with a locale named
        run: zig build example -- fi

      # The point of having a macOS runner at all. `fluent.darwin` reads the
      # user's language out of the preferences rather than the environment,
      # because a program started from the Finder has no `LANG` -- and until
      # this step existed there was no way to find out whether it read them
      # correctly, only whether it compiled.
      #
      # So: tell macOS the user prefers Finnish, take the environment away so
      # that the POSIX path cannot answer, and require the Finnish text back.
      # A wrong answer fails here rather than looking plausible.
      - name: Read a language macOS was told to prefer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          defaults write -g AppleLanguages '("fi-FI", "en-US")'
          defaults write -g AppleLocale -string "fi_FI"
          echo "--- what macOS now reports ---"
          defaults read -g AppleLanguages
          defaults read -g AppleLocale

          # `env -u` rather than `env -i`: the build needs PATH and HOME.
          output=$(env -u LANG -u LANGUAGE -u LC_ALL -u LC_MESSAGES \
                       -u LC_NUMERIC -u LC_TIME -u LC_MONETARY \
                   zig build example)
          echo "--- what the library answered ---"
          echo "$output"

          # `Tervetuloa Kuvakirjastoon!` is the Finnish welcome, and it can
          # only come from the preferences: nothing in the environment says
          # Finnish, and the catalog's first entry is en-US.
          if ! grep -q "Tervetuloa" <<<"$output"; then
            echo "::error::AppleLanguages said Finnish and the library did not answer in it"
            exit 1
          fi
          # And the formats follow AppleLocale, which is the other preference.
          # Matched on the decimal comma alone: Finnish groups with U+00A0
          # rather than a space, so a literal "12 345,7" written here would
          # never match however right the answer was.
          if ! grep -q "345,7" <<<"$output"; then
            echo "::error::AppleLocale said fi_FI and the numbers came back in another format"
            exit 1
          fi

      # The environment still wins where it is set, which is what a person
      # running from a terminal expects and is the same rule POSIX has. Same
      # preferences as above, one variable put back.
      - name: An explicit LC_ALL still beats the preferences
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          output=$(LC_ALL=en_US.UTF-8 zig build example)
          echo "$output"
          if ! grep -q "Welcome to Photo Vault" <<<"$output"; then
            echo "::error::LC_ALL=en_US was set and the preferences answered anyway"
            exit 1
          fi
