name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check --exclude zig-pkg --exclude cldr/zig-pkg --exclude conformance/zig-pkg .

      - name: Test
        run: nix develop -c zig build test --summary all

      # The three corpora this library is measured against, which live in
      # `conformance/` -- a project of its own, so that two monorepos and a
      # spec repository stay out of this one's manifest and out of everything
      # generated from it. They are fetched by this step and by nothing else.
      - name: Conformance suites
        run: nix develop -c zig build conformance -- --summary all

      - name: Build
        run: nix develop -c zig build

      # The tools nothing else compiles: the fuzz driver and the docs server.
      # Without this they could stop compiling and no test would notice.
      - name: Compile everything else
        run: nix develop -c zig build check

      # And the CLDR generator, which is in `cldr/` with the 138 MB of Unicode
      # data it reads. Type-checked rather than run -- regenerating the tables
      # is a maintainer's errand -- and without `-Dcldr` it fetches none of
      # that data to do it.
      - name: Compile the CLDR generator
        run: nix develop ..#default -c zig build check
        working-directory: cldr

      # The C example, built the way a C project builds: gcc and a Makefile,
      # with Zig reaching only as far as the library. `zig build test` links
      # its C test with Zig, which supplies `compiler_rt`; a foreign linker
      # does not, and this is the step that noticed. Nothing else compiles it,
      # so without this it could stop working and no test would say so.
      - name: Build and run the C example
        run: nix develop -c make -C examples/c run

      # The GTK example, which is the same program with a window in front of
      # it. Headless, under Xvfb and the cairo renderer, because GTK 4 draws
      # through GL by default and there is no GL here. `--smoke` drives the
      # real controls -- the language menu, the count -- rather than calling
      # the formatting directly, so what this covers is the whole program.
      #
      # The step checks what the run printed rather than only how it exited:
      # it must reach `smoke complete` and it must warn about nothing. A
      # program that drew nothing exits zero as happily as one that worked,
      # and a GTK warning here is a finding rather than an artifact of running
      # headless. See the comment on the `smoke` target.
      #
      # The Swift and Win32 examples cannot run here: these runners are Linux,
      # which is what `.github/workflows/test.yaml` exists for.
      - name: Build and run the GTK example
        run: nix develop -c make -C examples/gtk smoke

  # Published only from main, so that a branch build cannot replace the site
  # with a work in progress, and only after `test` has passed, so that it
  # cannot document a tree that does not compile.
  docs:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API docs
        run: nix develop -c zig build docs --system "$(nix build --print-out-paths .#zig-deps)"

      - name: Publish docs
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/zig-fluent/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs
